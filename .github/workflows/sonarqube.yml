name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # PostgreSQL for the account tests, which run against a real database (same image as docker-compose.yml).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: linkup
          POSTGRES_PASSWORD: linkup
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkup"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for accurate blame / new-code detection

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Test app with coverage
        working-directory: app
        run: npm run test:coverage

      - name: Restore .NET tools
        working-directory: backend
        run: dotnet tool restore

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # SonarScanner for .NET analyses the C# build and, through multi-language analysis
      # (sonar.scanner.scanAll), every other supported file in the repo, including app/ TypeScript.
      - name: Begin SonarQube analysis
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"LinkUp-Startup_App"
          /o:"linkup-startup"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE"
          /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,app/coverage/**,app/.expo/**,app/assets/**,backend/src/LinkUp.Api/Data/Migrations/**,shared/**"
          /d:sonar.coverage.exclusions="app/src/app/**,app/src/constants/**,**/__tests__/**,app/*.config.js,app/jest.setup.ts,backend/tests/**"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="app/coverage/lcov.info"

      - name: Build backend
        working-directory: backend
        run: dotnet build LinkUp.sln --no-incremental

      # The build regenerates shared/openapi.json; regenerate shared/api.ts from it and fail if either
      # differs from what is committed (C# DTOs and app types out of sync).
      - name: Check API contract is up to date
        working-directory: app
        run: |
          npm run generate:api
          git diff --exit-code -- ../shared/ || {
            echo "::error::shared/ is out of date. Build the backend, run 'npm run generate:api' in app/, and commit shared/."
            exit 1
          }

      - name: Test backend with coverage
        working-directory: backend
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Username=linkup;Password=linkup;Database=postgres
        run: dotnet test LinkUp.sln --no-build --collect:"XPlat Code Coverage;Format=opencover"

      - name: End SonarQube analysis
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
